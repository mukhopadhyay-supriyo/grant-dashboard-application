server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Later, route /api/ to the Python API service or an AWS API endpoint.
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }
}
